[workspace]
members = ["gui"]

[package]
name = "multitool"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
clap = { version = "4.6.9", features = ["derive", "env"] }
dialoguer = "0.12.0"
dirs = "7.0.0"
dotenvy = "0.15.7"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "bmp"] }
qrcode = { version = "0.15.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "multipart", "rustls", "http2"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
which = "8.0.6"
