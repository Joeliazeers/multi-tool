[package]
name = "multitool-gui"
version = "0.2.0"
edition = "2024"
description = "GUI MultiTool: download video, transcribe, translate subtitle, QR code"

[[bin]]
name = "multitool-gui"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
multitool = { path = ".." }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
which = "8"
dirs = "7"
